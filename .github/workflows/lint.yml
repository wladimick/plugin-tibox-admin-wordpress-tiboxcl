name: Syntax checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify device parser
        run: php tests/context-smoke.php
      - name: Verify tracking behaviors and GTM isolation
        run: |
          node tests/tracking-smoke.cjs > tracking-test.log 2>&1 || {
            cat tracking-test.log
            echo '### Tracking test failure' >> "$GITHUB_STEP_SUMMARY"
            echo '\x60\x60\x60text' >> "$GITHUB_STEP_SUMMARY"
            cat tracking-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '\x60\x60\x60' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          cat tracking-test.log
      - name: Verify Web Vitals PHP ratings
        run: php tests/vitals-rating-smoke.php
      - name: Verify Web Vitals frontend privacy and batching
        run: node tests/vitals-smoke.cjs
      - name: Verify existing wpforms_submit event without duplicate conversions
        run: node tests/tracking-forms-regression.cjs
      - name: Verify native landing REST conversion success and deduplication
        run: node tests/landing-gtm-bridge-smoke.cjs
      - name: Verify standalone HTML landing opt-in conversion injection
        run: php tests/landing-gtm-html-smoke.php
      - name: Verify native Contact form sanitation and legacy mutual exclusion
        run: php tests/native-contacts-smoke.php
      - name: Verify native WPForms persistence and conversion compatibility gating
        run: php tests/native-form-php-smoke.php
      - name: Verify contact admin settings with separate tracking and GTM opt-in
        run: php tests/contact-settings-smoke.php
      - name: Verify confirmed form conversions and legacy GTM parity
        run: node tests/native-form-conversions-smoke.cjs
      - name: Verify native WhatsApp reference and contact click tracking
        run: node tests/native-clicks-smoke.cjs
      - name: Verify native click REST ingestion and security checks
        run: php tests/native-click-endpoint-smoke.php
      - name: Verify optional floating WhatsApp button and reference
        run: node tests/native-wa-button-smoke.cjs
      - name: Verify Contacts delete protection and CSV output safety
        run: php tests/contacts-delete-csv-smoke.php
      - name: Verify historical WPForms and Landing contacts import and deduplication
        run: php tests/unified-inbox-sources-smoke.php
      - name: Verify independent WhatsApp button with legacy TIBOX Leads
        run: php tests/whatsapp-independent-smoke.php
